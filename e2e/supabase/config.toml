# Throwaway Supabase stack for the Playwright E2E suite (CLT-R-029).
#
# The suite signs in through Supabase Auth and saves real entries through the
# app, so it must never share the development database. This stack is a second
# Supabase project with its own containers, volumes and ports; `db reset`
# rebuilds it from `supabase/migrations` every run, and stopping it discards
# nothing anyone needs.
#
# Start/stop through `pnpm test:e2e:isolated` (scripts/e2e/isolated-stack.ts),
# which also bootstraps the owner account and points the dev server here.

project_id = "ledger_e2e"

[api]
enabled = true
port = 54341
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54342
shadow_port = 54340
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5199"
additional_redirect_urls = ["http://127.0.0.1:5199"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "10MiB"

# Everything below exists only to keep this stack off the development stack's
# ports and out of its way; the app does not use them.
[studio]
enabled = false

[inbucket]
enabled = false

[analytics]
enabled = false

[realtime]
enabled = false
